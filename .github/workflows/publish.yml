name: publish-artifacts
# Copies the libraries of a finished build run to the "artifacts" branch,
# so they can be fetched with plain git.  The run id is read from PUBLISH.
on:
  push:
    branches: [main]
    paths: ["PUBLISH", ".github/workflows/publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: echo "id=$(tr -d '[:space:]' < PUBLISH)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to the artifacts branch
        run: |
          cd dist
          ls -R | head -40
          echo "build run ${{ steps.run.outputs.id }}" > RUN.txt
          shasum -a 256 */* > SHA256SUMS.txt
          git init -q -b artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Libraries from build run ${{ steps.run.outputs.id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts
