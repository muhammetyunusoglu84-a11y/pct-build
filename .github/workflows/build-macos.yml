name: build-macos-arm64
on:
  push:
    branches: [main]
    paths: ["pct_ba/**", "scripts/**", "tests/**", ".github/workflows/build-macos.yml", "BUILD"]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  PYTHON_VERSION: "3.12"

jobs:
  solver:
    name: Bundle adjustment core (Ceres)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: work/prefix
          key: ceres-2.2.0-eigen-3.4.0-macos-arm64-v2
      - name: Build
        run: ./pct_ba/build.sh work out/solver
      - name: Test
        run: |
          python -m pip install -q numpy scipy
          otool -L out/solver/libpct_ba.dylib
          python tests/test_pct_ba.py out/solver/libpct_ba.dylib
      - uses: actions/upload-artifact@v4
        with: { name: solver-macos-arm64, path: out/solver }

  pyav:
    name: FFmpeg (LGPL) + PyAV
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
      - uses: actions/cache@v4
        with:
          path: ffprefix
          key: ffmpeg-n9.0.2-lgpl-macos-arm64-v1
      - name: Build FFmpeg
        run: test -f ffprefix/ffmpeg-build-info.txt || ./scripts/build_ffmpeg.sh work ffprefix
      - name: Build PyAV
        run: ./scripts/build_pyav.sh ffprefix out/pyav
      - uses: actions/upload-artifact@v4
        with: { name: pyav-macos-arm64, path: out/pyav }

  opencv:
    name: OpenCV (minimal, no FFmpeg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: ./scripts/build_opencv.sh out/opencv
      - uses: actions/upload-artifact@v4
        with: { name: opencv-macos-arm64, path: out/opencv }

  verify:
    name: Verify (tests + license scan)
    needs: [solver, pyav, opencv]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Install and test
        run: |
          ls -R dist | head -60
          python -m pip install -q numpy scipy
          python -m pip install --no-deps dist/pyav-macos-arm64/av-*.whl dist/opencv-macos-arm64/opencv_python_headless-*.whl
          python tests/test_media.py
          python tests/test_pct_ba.py dist/solver-macos-arm64/libpct_ba.dylib
      - name: License scan
        run: python scripts/check_licenses.py dist
      - name: Linked libraries
        run: |
          mkdir x && cd x && for w in ../dist/*/*.whl; do unzip -q -o "$w"; done
          for f in $(find . -name "*.dylib" -o -name "*.so"); do echo "== $f"; otool -L "$f" | tail -n +2 | grep -v "/usr/lib/\|/System/Library/" || true; done
